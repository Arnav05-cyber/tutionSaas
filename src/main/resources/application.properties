spring.application.name=tutionSAAS
server.port=${PORT:8080}

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edutech_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clerk Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URL:your_clerk_issuer_url}
clerk.secret-key=${CLERK_SECRET_KEY:your_clerk_secret_key}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local file storage path
app.storage.local.path=./uploads

# Frontend URL (Used for CORS and Invites)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Razorpay credentials
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret}

# Storage provider: 'local' (default) or 'supabase'
app.storage.provider=${STORAGE_PROVIDER:supabase}

# Supabase Storage (used when app.storage.provider=supabase)
supabase.url=${SUPABASE_URL:your_supabase_url}
supabase.secret.key=${SUPABASE_SECRET_KEY:your_supabase_secret_key}
supabase.storage.bucket=${SUPABASE_BUCKET:resources}